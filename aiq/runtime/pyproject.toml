[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aiq-agentcore"
version = "0.1.0"
description = "AWS adapter running the NVIDIA AI-Q Blueprint on Amazon Bedrock AgentCore Runtime"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT-0" }
dependencies = [
  "bedrock-agentcore>=1.23.0,<2",
  "boto3>=1.43.72,<2",
  "pydantic>=2.7,<3",
  "PyJWT[crypto]>=2.9,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "playwright>=1.50,<2",
  "aws-bedrock-token-generator>=1.0,<2",
  "langchain-openai>=0.3,<2",
  "langchain-anthropic>=0.3,<2",
]

[project.optional-dependencies]
# The upstream AI-Q engine (NAT + LangChain/LangGraph). Pinned in requirements.lock
# for the container; kept optional so the adapter's own tests run without it.
aiq = ["aiq-agent"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "moto[dynamodb,s3]>=5", "ruff>=0.6"]

[project.entry-points."nat.plugins"]
aiq_agentcore_web_search = "aiq_agentcore.nat_plugins.web_search"
aiq_agentcore_knowledge = "aiq_agentcore.nat_plugins.knowledge"
aiq_agentcore_fetch_page = "aiq_agentcore.nat_plugins.fetch_page"
aiq_agentcore_sandbox = "aiq_agentcore.nat_plugins.sandbox"

[project.entry-points."aiq.sandbox_providers"]
agentcore_code_interpreter = "aiq_agentcore.sandbox_agentcore:AgentCoreCodeInterpreterProvider"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiq_agentcore = ["py.typed", "data/*.json", "exports/*.css", "exports/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
